services:
  db:
    image: postgres:16
    container_name: redvital-db
    environment:
      POSTGRES_DB: redvital
      POSTGRES_USER: redvital
      POSTGRES_PASSWORD: redvital_local
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U redvital"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
